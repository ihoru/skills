name: Review upstream skills

on:
  schedule:
    # Monday 09:00 Asia/Tbilisi = 05:00 UTC (UTC+4, no DST).
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-skills-review
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-upstreams.txt
      - run: python -m unittest discover -s tests -v
      - name: Check selected paths
        id: check
        shell: bash
        run: |
          set +e
          python scripts/manage_upstreams.py check --json > "$RUNNER_TEMP/upstreams-check.json"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          python scripts/upstream_report.py "$RUNNER_TEMP/upstreams-check.json" > "$RUNNER_TEMP/upstreams-pr.md"
          cat "$RUNNER_TEMP/upstreams-pr.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Report validation failures in the existing review PR
        if: steps.check.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --head automation/upstream-skills --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body-file "$RUNNER_TEMP/upstreams-pr.md"
          fi
          exit 1
      - name: Update validated snapshots
        if: steps.check.outputs.status == '2'
        run: |
          python scripts/manage_upstreams.py update --json > "$RUNNER_TEMP/upstreams-updated.json"
          python scripts/upstream_report.py "$RUNNER_TEMP/upstreams-updated.json" > "$RUNNER_TEMP/upstreams-pr.md"
          python -m unittest discover -s tests -v
          python scripts/manage_upstreams.py verify
      - name: Create or refresh the single review PR
        if: steps.check.outputs.status == '2'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/upstream-skills
          title: 'chore: update selected upstream skills'
          commit-message: 'chore: update selected upstream skills'
          body-path: ${{ runner.temp }}/upstreams-pr.md
          add-paths: |
            upstreams.json
            vendor/
            postgres-database-migration
            vercel-react-best-practices
            redis-core
            redis-connections
            redis-security
            redis-observability
